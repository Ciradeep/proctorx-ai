<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Guardian - Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
             crimson: { 500: '#ef4444', 600: '#dc2626' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 font-inter text-sm antialiased h-screen flex items-center justify-center p-4">

  <div class="relative w-full max-w-md">
    <!-- Login Card -->
    <div class="border border-slate-800 bg-slate-900 shadow-2xl z-10 relative">
      <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-black/20">
        <div>
          <h1 class="text-xl font-bold uppercase tracking-widest">Exam Guardian</h1>
          <div class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mt-1">Access Terminal</div>
        </div>
        <div class="w-2 h-2 bg-emerald-500 animate-pulse"></div>
      </div>
      
      <div class="p-8">
        <form id="login-form" class="space-y-6">
          <div id="error-box" class="hidden bg-crimson-500/10 border border-crimson-500/50 text-crimson-500 p-3 text-xs font-mono mb-4">
             // ERROR: Invalid credentials
          </div>

          <div>
            <label class="block text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-2">Identifier (Email)</label>
            <input type="email" id="email" value="arjun@student.edu" required class="w-full bg-slate-950 border border-slate-700 text-slate-100 px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition-colors font-mono rounded-none">
          </div>
          
          <div>
            <label class="block text-[10px] font-mono text-slate-400 uppercase tracking-widest mb-2">Access Key (Password)</label>
            <input type="password" id="password" value="student123" required class="w-full bg-slate-950 border border-slate-700 text-slate-100 px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 transition-colors font-mono rounded-none">
          </div>

          <div class="flex gap-4 pt-4">
             <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-mono text-sm px-4 py-3 uppercase tracking-widest border border-indigo-400 transition-colors">
               AUTHENTICATE
             </button>
          </div>
        </form>

        <div class="mt-8 border-t border-slate-800 pt-6">
           <h3 class="text-[10px] font-mono text-slate-500 uppercase tracking-widest mb-3">System Roles Demo:</h3>
           <div class="grid grid-cols-2 gap-3">
              <button onclick="fillAdmin()" class="border border-slate-700 hover:border-slate-500 bg-slate-950 px-3 py-2 text-[10px] font-mono text-slate-400 uppercase tracking-widest transition-colors text-left">
                 [Load Admin]<br>admin@exam.edu
              </button>
              <button onclick="fillStudent()" class="border border-slate-700 hover:border-slate-500 bg-slate-950 px-3 py-2 text-[10px] font-mono text-slate-400 uppercase tracking-widest transition-colors text-left">
                 [Load Student]<br>arjun@student.edu
              </button>
           </div>
        </div>

      </div>
    </div>
    
    <!-- Decorative background elements -->
    <div class="absolute -top-4 -left-4 w-12 h-12 border-t-2 border-l-2 border-indigo-500/30 pointer-events-none"></div>
    <div class="absolute -bottom-4 -right-4 w-12 h-12 border-b-2 border-r-2 border-indigo-500/30 pointer-events-none"></div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // FORCE CLEAR SESSION if they visit the login page, allowing easy switching
    sessionStorage.removeItem('eg_session');

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const errBox = document.getElementById('error-box');
      
      const res = Auth.login(email, pass);
      if (res.success) {
        errBox.classList.add('hidden');
        window.location.href = res.role === 'admin' ? 'admin-dashboard.html' : 'index.html';
      } else {
        errBox.textContent = `// ERROR: ${res.error}`;
        errBox.classList.remove('hidden');
      }
    });

    function fillAdmin() {
       document.getElementById('email').value = 'admin@exam.edu';
       document.getElementById('password').value = 'admin123';
    }
    
    function fillStudent() {
       const students = Auth.getAllStudents();
       const random = students[Math.floor(Math.random() * students.length)];
       document.getElementById('email').value = random.email;
       document.getElementById('password').value = random.password;
    }
  </script>
</body>
</html>
